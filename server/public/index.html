<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Ocai - Поиск товаров из Китая</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236C63FF'/><text y='48' x='10' font-size='40'>🛍️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0F0F1A;
      color: #fff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px;
    }

    .container { width: 100%; max-width: 520px; padding-top: 60px; }

    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }

    .logo {
      width: 44px; height: 44px;
      background: #6C63FF;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .logo-text h1 { font-size: 22px; font-weight: 700; }
    .logo-text p  { font-size: 12px; color: #8888AA; }

    .title    { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #8888AA; margin-bottom: 32px; }

    .search-box {
      background: #1A1A2E;
      border: 1.5px solid #6C63FF;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 8px;
    }

    .search-box textarea {
      width: 100%; background: transparent;
      border: none; outline: none;
      color: #fff; font-size: 15px;
      resize: none; font-family: inherit; line-height: 1.5;
    }

    .search-box textarea::placeholder { color: #555577; }

    .status { font-size: 13px; color: #8888AA; text-align: center; min-height: 20px; margin: 6px 0; }

    .btn-search {
      width: 100%; height: 52px;
      background: #6C63FF; color: #fff;
      border: none; border-radius: 14px;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s;
    }

    .btn-search:hover    { background: #5A52E0; }
    .btn-search:disabled { background: #3D3860; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .quick-links { margin-top: 32px; }
    .quick-links > p { font-size: 13px; color: #8888AA; margin-bottom: 12px; }

    .links { display: flex; gap: 12px; }

    .quick-link {
      flex: 1; background: #1A1A2E;
      border-radius: 12px; padding: 12px 8px;
      text-align: center; text-decoration: none; color: #fff;
      font-size: 12px; transition: background 0.2s;
    }

    .quick-link:hover { background: #252540; }
    .quick-link .icon { font-size: 20px; margin-bottom: 4px; }

    .footer {
      margin-top: auto; padding: 24px 0 16px;
      font-size: 11px; color: rgba(255,255,255,0.25); text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🛍️</div>
      <div class="logo-text">
        <h1>Ocai</h1>
      </div>
    </div>

    <div class="title">Что вы ищете?</div>
    <div class="subtitle">Опишите товар на русском языке</div>

    <div class="search-box">
      <textarea id="searchInput" rows="3"
        placeholder="Например: хочу купить зимнюю куртку для ребёнка 5 лет..."></textarea>
    </div>

    <div class="status" id="statusText"></div>

    <button class="btn-search" id="searchBtn" onclick="doSearch()">
      <span id="spinner" class="spinner"></span>
      <span id="btnContent">🔍 Найти товар</span>
    </button>

  </div>

<script>
    // 回车搜索（Shift+Enter 换行）
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSearch(); }
    });

    async function doSearch() {
      const input = document.getElementById('searchInput').value.trim();
      if (!input) return;

      setLoading(true, 'Ищу товары...');

      let keywords = input;

      try {
        // 调后端代理（API Key 在服务端，不暴露）
        const res = await fetch('/api/keywords', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input }),
        });

        if (res.ok) {
          const data = await res.json();
          keywords = data.keywords;
          setStatus('Ищу: ' + keywords);
        }
      } catch (e) {
        console.warn('API error, using raw input');
      }

      // 跳转 ocai.ru 搜索
      window.open('https://ocai.ru/search?keyword=' + encodeURIComponent(keywords), '_blank');
      setLoading(false, '');
    }

    function setLoading(loading, text) {
      const btn     = document.getElementById('searchBtn');
      const spinner = document.getElementById('spinner');
      const content = document.getElementById('btnContent');
      btn.disabled           = loading;
      spinner.style.display  = loading ? 'block' : 'none';
      content.style.display  = loading ? 'none' : 'inline';
      setStatus(text);
    }

    function setStatus(text) {
      document.getElementById('statusText').textContent = text;
    }
  </script>
</body>
</html>
